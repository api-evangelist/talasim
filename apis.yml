name: Talasim
description: Talasim was a Jordanian user-generated-content website that curated photographs
  of funny signs on cars, stores, and roads, positioned as an online comedy and self-expression
  channel. Backed by Seedcamp, it was acquired by the regional reviews-and-listings community
  Jeeran (Amman, Jordan) in March 2010, with its engineering team absorbed into Jeeran's
  localisation efforts. The company no longer operates as an independent entity and publishes
  no developer, API, or documentation surface; the referenced jeeran.com domain no longer
  serves a live site (TLS handshake failure). This profile entered the API Evangelist network
  as a Seedcamp portfolio stub and has been enriched to reflect its acquired, no-API status.
